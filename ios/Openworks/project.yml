name: Openworks
options:
  bundleIdPrefix: dev.openworks
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(OPENWORKS_TEAM_ID)"

packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.3"

targets:
  Openworks:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftMath
        product: SwiftMath
    # APNs. `development` is the sandbox host, which is what a build installed
    # from Xcode gets a token for; an App Store build is re-signed to
    # `production` automatically, and the app reads this back at runtime so it
    # tells the backend which host issued its token rather than guessing.
    entitlements:
      path: Openworks.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Openworks
        PRODUCT_BUNDLE_IDENTIFIER: dev.openworks.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "YES"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Openworks
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Pretendard-Thin.ttf
          - Pretendard-ExtraLight.ttf
          - Pretendard-Light.ttf
          - Pretendard-Regular.ttf
          - Pretendard-Medium.ttf
          - Pretendard-SemiBold.ttf
          - Pretendard-Bold.ttf
          - Pretendard-ExtraBold.ttf
          - Pretendard-Black.ttf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Filled from Secrets.xcconfig at build time so a checkout carries no
        # deployment and no key. Both are overridable on the Settings screen.
        OPENWORKS_CONVEX_URL: "$(OPENWORKS_CONVEX_URL)"
        OPENWORKS_SERVICE_KEY: "$(OPENWORKS_SERVICE_KEY)"

  OpenworksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Openworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openworks.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Openworks
        TARGETED_DEVICE_FAMILY: "1"

  OpenworksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Openworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openworks.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Openworks:
    build:
      targets:
        Openworks: all
        OpenworksUITests: [test]
        OpenworksTests: [test]
    test:
      environmentVariables:
        OPENWORKS_DEMO: "1"
      targets:
        - OpenworksTests
        - OpenworksUITests
