<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ping-loading</title>
  </head>
  <body>
    <script>
      const value = { ok: true, at: new Date().toISOString(), hash: location.hash };
      try {
        localStorage.setItem("openworks:ping", JSON.stringify(value));
      } catch {}
      document.title = "ping-ok";
      location.hash = "result=" + encodeURIComponent(JSON.stringify(value));
      document.body.textContent = JSON.stringify(value);
    </script>
  </body>
</html>
