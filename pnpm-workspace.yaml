packages:
  - "packages/*"
  - "browser"
  - "site"

# pnpm 11 key. Convex, Vite and Tauri all shell out to esbuild's platform
# binary, which only exists after its postinstall runs.
allowBuilds:
  "@anthropic-ai/claude-code": true
  "@clerk/shared": true
  esbuild: true
  # Embeddings run through this. Without its native binding there is no
  # on-device inference, and the no-API-key path stops existing.
  onnxruntime-node: true
  protobufjs: true
  sharp: true

# Advisories in transitive dependencies we do not choose ourselves. Every entry
# is the minimum patched version from the advisory, not the newest release, so
# the pin moves as little as the fix requires. nanoid is split by major because
# two different majors are in the tree and forcing either one onto the other
# breaks the consumer that asked for it.
overrides:
  # onnxruntime-node > adm-zip: a crafted zip allocates 4GB; 0.6.1 closes the
  # extraction and decompression advisories that followed
  adm-zip: "^0.6.1"
  # @huggingface/transformers and astro > sharp: inherited libvips CVEs
  sharp: "^0.35.4"
  # @modelcontextprotocol/sdk > hono: ReDoS in CORS, DoS in language middleware
  hono: "^4.13.7"
  # @modelcontextprotocol/sdk > express and express-rate-limit, and ajv
  qs: "^6.16.0"
  ip-address: "^10.7.1"
  fast-uri: "^3.1.6"
  # @modelcontextprotocol/sdk > express
  proxy-addr: "^2.0.8"
  # astro, and unifont below it
  devalue: "^5.9.3"
  svgo: "^4.1.0"
  js-yaml: "^4.3.2"
  undici: "^8.10.2"
  smol-toml: "^1.9.0"
  # tailwind and csso
  source-map-js: "^1.2.2"
  # @tailwindcss/typography pins 6.0.10, and every 6.x parses a flat selector in
  # quadratic time. 7.0's one breaking change is insertion during a walk
  postcss-selector-parser: "^7.1.6"
  # excalidraw > mermaid-to-excalidraw and below
  mermaid: "^11.16.1"
  dompurify: "^3.4.16"
  lodash-es: "^4.17.24"
  nanoid@3: "^3.3.18"
  # mermaid-to-excalidraw resolves nanoid 4, which no patched release exists for.
  # 4 and 5 are both ESM-only and the surface used here (nanoid, customAlphabet)
  # is unchanged between them, so the fix is to move that path onto 5.
  nanoid@4: "^5.1.16"
  nanoid@5: "^5.1.16"
  # rehype-katex and mermaid > katex: prototype pollution can bypass trust checks.
  # 0.18 also renamed the classes katex.min.css styles, so the renderer and the
  # browser's stylesheet have to resolve to the same katex
  katex: "^0.18.2"
