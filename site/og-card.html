<!doctype html>
<!--
  Source for public/og.png. Not a page: it lives outside src/pages and public/
  so nothing builds or serves it. Open it at exactly 1200x630 and screenshot
  over the png. Kept as markup because a social card is typography, and
  editing type in a binary means redrawing it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Openworks og card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />
    <style>
      :root {
        --slate: #3d5a80;
        --sage: #5a7a5a;
        --ochre: #5c5c5c;
        --ink: #0a0a0a;
        --ink-2: #4a4a4a;
        --line: #e4e4e4;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        /* The ruled ground of a notebook, at the leading the headline sits on. */
        background-image: repeating-linear-gradient(
          to bottom,
          #f5f5f5 0,
          #f5f5f5 1px,
          transparent 1px,
          transparent 39px
        );
        padding: 78px 80px;
        display: flex;
        flex-direction: column;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand svg {
        width: 66px;
        height: 66px;
        display: block;
      }
      .brand span {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 54px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 102px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-weight: 400;
        color: var(--ink);
        margin-top: 66px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: auto;
        display: flex;
        gap: 12px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 9px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 10px 16px;
        font-size: 17px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      li::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 1px;
        background: var(--sage);
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 64 64">
        <defs>
          <path
            id="blade"
            d="M 32 32 C 24.6 31.4, 18.3 26.7, 16.6 19.6 C 15.6 14.6, 18.5 10.3, 23.2 9.3 C 26.3 8.7, 29.0 10.2, 30.2 12.9 C 28.4 18.6, 29.3 25.5, 32 32 Z"
          />
        </defs>
        <g transform="translate(32 32) scale(1.34) translate(-32 -32)">
          <use fill="var(--slate)" href="#blade" />
          <use fill="var(--sage)" href="#blade" transform="rotate(60 32 32)" />
          <use fill="var(--ochre)" href="#blade" transform="rotate(120 32 32)" />
          <use fill="var(--slate)" href="#blade" transform="rotate(180 32 32)" />
          <use fill="var(--sage)" href="#blade" transform="rotate(240 32 32)" />
          <use fill="var(--ochre)" href="#blade" transform="rotate(300 32 32)" />
        </g>
      </svg>
      <span>Openworks</span>
    </div>

    <h1>Work in progress,<br />addressable.</h1>

    <ul>
      <li>No API keys</li>
      <li>No metered inference</li>
      <li>No hosted tier</li>
    </ul>
  </body>
</html>
